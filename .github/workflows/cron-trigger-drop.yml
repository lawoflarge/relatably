name: Cron — Trigger Drop

on:
  schedule:
    # Every 5 minutes (GitHub Actions cron minimum granularity)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  trigger-drop:
    name: POST /api/cron/trigger-drop
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel endpoint
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL secret is not set"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set"
            exit 1
          fi
          curl -fSs \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$API_BASE_URL/api/cron/trigger-drop"
