workflows:
  ios-production:
    name: iOS Production -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: relatably-asc
    environment:
      vars:
        XCODE_WORKSPACE: "Relatably.xcworkspace"
        XCODE_SCHEME: "Relatably"
        BUNDLE_ID: "co.relatably.app"
        APP_STORE_APPLE_ID: 6768082631
      node: 20.18.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install JS dependencies
        working_directory: ios
        script: |
          set -e
          # Bypass Codemagic's stale-corepack pnpm shim (signature verification
          # fails when corepack tries to fetch latest pnpm at runtime).
          corepack disable 2>/dev/null || true
          sudo rm -f /usr/local/bin/pnpm /usr/local/bin/pnpx 2>/dev/null || true
          npm install -g pnpm@10.11.0
          hash -r 2>/dev/null || true
          which pnpm
          pnpm --version
          # Verbose reporter + network concurrency cap + retry caps so logs
          # stream live and any registry stall self-recovers or fails the
          # individual fetch (instead of the whole step hanging silently).
          # No bash `timeout` wrapper -- macOS runners lack GNU coreutils.
          # The workflow-level max_build_duration: 60 bounds total runtime.
          export PNPM_HOME="$HOME/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          pnpm install \
            --frozen-lockfile \
            --reporter=append-only \
            --network-concurrency=8 \
            --fetch-retries=3 \
            --fetch-retry-mintimeout=10000 \
            --fetch-retry-maxtimeout=60000

      - name: Expo prebuild (generate native iOS project)
        working_directory: ios
        script: |
          set -e
          npx expo prebuild --platform ios --clean --no-install

      - name: Pod install
        working_directory: ios/ios
        script: |
          set -e
          pod install

      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          # Generate a fresh private key so Codemagic can create a new
          # iOS Distribution certificate it actually has the key for.
          # Existing certs in ASC (from prior EAS builds) cannot be reused
          # because Expo retains their private keys on their servers,
          # producing: "Cannot save Signing Certificates without certificate private key".
          mkdir -p /tmp/codemagic-signing
          openssl genrsa -out /tmp/codemagic-signing/cert_key.pem 2048
          # Codemagic CLI requires the @file: prefix for path-based args
          # (otherwise it tries to parse the path as the raw key contents).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/codemagic-signing/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number to one above TestFlight latest
        working_directory: ios/ios
        script: |
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Bumping CFBundleVersion to $NEXT_BUILD_NUMBER"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Build .ipa archive
        working_directory: ios/ios
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - ios/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Founders
