workflows:
  ios-production:
    name: iOS Production -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: relatably-asc
    environment:
      vars:
        XCODE_WORKSPACE: "Relatably.xcworkspace"
        XCODE_SCHEME: "Relatably"
        BUNDLE_ID: "co.relatably.app"
        APP_STORE_APPLE_ID: 6768082631
      node: 20.18.0
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install JS dependencies
        working_directory: ios
        script: |
          set -e
          # pnpm is already installed on Codemagic mac_mini_m2 runners.
          # Install only if missing.
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm
          fi
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Expo prebuild (generate native iOS project)
        working_directory: ios
        script: |
          set -e
          npx expo prebuild --platform ios --clean --no-install

      - name: Pod install
        working_directory: ios/ios
        script: |
          set -e
          pod install

      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Increment build number to one above TestFlight latest
        working_directory: ios/ios
        script: |
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Bumping CFBundleVersion to $NEXT_BUILD_NUMBER"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Build .ipa archive
        working_directory: ios/ios
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - ios/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Founders
